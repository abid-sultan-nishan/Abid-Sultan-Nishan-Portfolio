<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Neural Mesh Connections -->
  <g stroke="url(#neon)" stroke-width="1.2" opacity="0.6" filter="url(#glow)">
    <line x1="18" y1="20" x2="32" y2="14" />
    <line x1="32" y1="14" x2="46" y2="20" />
    <line x1="18" y1="20" x2="32" y2="32" />
    <line x1="46" y1="20" x2="32" y2="32" />
    <line x1="18" y1="44" x2="32" y2="32" />
    <line x1="46" y1="44" x2="32" y2="32" />
    <line x1="18" y1="44" x2="32" y2="50" />
    <line x1="46" y1="44" x2="32" y2="50" />
    <line x1="18" y1="20" x2="18" y2="44" />
    <line x1="46" y1="20" x2="46" y2="44" />
  </g>

  <!-- Center Transformer Core -->
  <circle cx="32" cy="32" r="5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />

  <!-- Outer Tensor Nodes -->
  <circle cx="18" cy="20" r="3" fill="#A855F7" />
  <circle cx="46" cy="20" r="3" fill="#38BDF8" />
  <circle cx="32" cy="14" r="3.5" fill="#2DD4BF" />
  <circle cx="18" cy="44" r="3" fill="#38BDF8" />
  <circle cx="46" cy="44" r="3" fill="#A855F7" />
  <circle cx="32" cy="50" r="3.5" fill="#38BDF8" />
</svg>
